version: "3.3"
services:
  db:
    image: postgres:12
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=go_stream_dev
    ports:
      - "5440:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    container_name: db-c-dev
  app:
    build:
      context: .
      dockerfile: dev.Dockerfile
    ports:
      - "3005:3005"
    env_file:
      - .env
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: be-c-dev
  redis:
    image: redis:alpine
    container_name: redis-c-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    
volumes:
  pgdata-dev:
  redis-data:
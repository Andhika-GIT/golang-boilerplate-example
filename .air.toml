root = "."
testdata_dir = "testdata"
tmp_dir = "/tmp/app"  # Changed to absolute path for Docker compatibility

[build]
  args_bin = []
  bin = "/tmp/app/main"  # Absolute path for Docker
  cmd = "go build -o /tmp/app/main ./cmd/main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", ".git", "logs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = "" 
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = true  # Important for Docker
  poll_interval = 1000
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true  # Better for graceful shutdown
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = true  # Helpful for debugging

[misc]
  clean_on_exit = true  # Cleanup tmp files
  safe = false

[proxy]
  app_port = 3005  # Match your exposed port
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true